<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRIMER NABATI BUBUK (KRIMER MINUMAN)</title>
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <nav
    class="navbar py-2 navbar-light "
    style="background-color: #ffffff"   
  >
      <div class="container ">
      <p class="navbar-brand text-dark">
        <b>KRIMER NABATI BUBUK (KRIMER MINUMAN)</b>
      </p>    
  </nav>

  <body>
    <div class="container ">
    <table class="table table-bordered" style="color: black;">
      <thead>
         <tr class="bg-light text-center">
            <th colspan="6">INFORMASI NILAI GIZI</th>
         </tr>
         <tr class="">
            <td colspan="6">Takaran saji 10 g</td>
         </tr>
         <tr class="">
            <td colspan="6"></td>
         </tr>
      </thead>
      <thead>
        <tr class="bg-light text-left" style="border-top: 3px solid black;">
           <th colspan="6">JUMLAH PERSAJIAN</th>
        </tr>
      </thead>
      
      <tbody>
        <tr class="text-left">
          <th colspan="4">Energi Total</th>
          <th colspan="4">50 kkal</th>
       </tr>
        <tr class="">
           <td colspan="4">Energi dari lemak</td>
           <td colspan="4">30 kkal</td>
        </tr>
        <tr class="">
           <td colspan="4">Energi dari lemak jenuh</td>
           <td colspan="4">20 kkal</td>
        </tr>
      </tbody>
        <thead>
          <tr class="bg-light text-right" style="border-top: 3px solid black;">
            <th colspan="0"></th>
            <th colspan="6">% AKG</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th colspan="4">Lemak total</th>
            <th>3 g</th>
            <th class="text-right">5 %</th>
          </tr>
          <tr>
            <th colspan="4">Lemak jenuh</th>
            <th>2 g</th>
            <th class="text-right">11 %</th>
          </tr>
          <tr>
            <th colspan="4">Protein</th>
            <th>0 g</th>
            <th class="text-right">0 %</th>
          </tr>
          <tr>
            <th colspan="4">Karbohidrat total</th>
            <th>6 g</th>
            <th class="text-right">2 %</th>
          </tr>
          <tr>
            <th colspan="4">Gula</th>
            <th>1 g</th>
          </tr>
          <tr>
            <th colspan="4">Garam (Natrium)</th>
            <th>20 mg</th>
            <th class="text-right">1 %</th>
          </tr>
        </tbody>
        <thead>
          <tr class="text-left">
            <td colspan="6"></td>
          </tr>
        </thead>
    </div>
   </table>
    <script
      src="https://code.jquery.com/jquery-3.5.1.js"
      integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc="
      crossorigin="anonymous"
    ></script>
    <script type="text/javascript" src="js/bootstrap.js"></script>
  </body>
</html>
